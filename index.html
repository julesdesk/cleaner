<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engraving Tools Dashboard</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --button: #111827;
      --button-secondary: #6b7280;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      letter-spacing: -0.4px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .tool {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 6px 20px rgba(17, 24, 39, 0.05);
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      display: block;
      margin-bottom: 3px;
      font-weight: bold;
      font-size: 12px;
    }

    textarea,
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      line-height: 1.35;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 55px;
      resize: vertical;
      white-space: pre-wrap;
    }

    .large textarea {
      min-height: 90px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 4px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12px;
      cursor: pointer;
      background: var(--button);
      color: #fff;
    }

    button.secondary {
      background: #f3f4f6;
      color: var(--text);
      border-color: var(--border);
    }

    button.small {
      padding: 5px 8px;
      font-size: 11px;
    }

    button:hover { opacity: 0.9; }

    .note {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    #rulesBox {
      display: none;
      margin-top: 6px;
    }

    .rules-row {
      display: grid;
      grid-template-columns: auto 1fr auto 1fr auto;
      gap: 5px;
      margin-bottom: 5px;
      align-items: center;
      font-size: 11px;
    }

    .rules-row input {
      padding: 5px;
      font-size: 11px;
    }

    .checks {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      margin: 4px 0 2px;
    }

    .counter-number {
      font-size: 24px;
      font-weight: bold;
      margin-top: 2px;
    }

    @media (max-width: 780px) {
      body { padding: 10px; }
      .rules-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <h1>Engraving Tools Dashboard</h1>



    <section class="tool">
      <h2>GPS Coordinate Cleaner N20°W20°</h2>
      <div class="grid">
        <div>
          <label for="gpsInput"></label>
          <textarea id="gpsInput" placeholder=""></textarea>
        </div>
        <div>
          <label for="gpsOutput"></label>
          <textarea id="gpsOutput" placeholder=""></textarea>
        </div>
      </div>
      <div class="buttons">
        <button onclick="formatGPS()">Format</button>
        <button class="secondary" onclick="clearFields('gpsInput', 'gpsOutput')">Clear</button>
        <button class="secondary" onclick="addDotsToGPS()">Add dots (•)</button>
        <button class="secondary" onclick="copyText('gpsOutput')">Copy</button>
      </div>
    </section>

    <section class="tool">
      <h2>•♥†♥†•SYMBOLS•♥†♥†•</h2>
      <div class="grid">
        <div>
          <label for="symbolInput"></label>
          <textarea id="symbolInput" placeholder=""></textarea>
        </div>
        <div>
          <label for="symbolOutput"></label>
          <textarea id="symbolOutput" placeholder=""></textarea>
        </div>
      </div>

      <div id="rulesBox"></div>
  <div class="checks">
        <label><input type="checkbox" id="uppercaseOutput" onchange="convertSymbols()" /> Uppercase</label>
        <label><input type="checkbox" id="capitalizeWords" onchange="convertSymbols()" /> Capitalize Words</label>
      </div>
      
      <div class="buttons">
        <button class="secondary" onclick="copyText('symbolOutput')">Copy</button>
        <button onclick="addRule()">+ Add Rule</button>
        <button onclick="convertSymbols()">Convert</button>
        <button class="secondary" onclick="clearSymbolConverter()">Clear</button>
  
      </div>

    

      <div class="note"></div>
    </section>

<section class="tool large">
      <h2>Order Details Cleaner</h2>
      <div class="grid">
        <div>
          <label for="orderInput">Input</label>
          <textarea id="orderInput" placeholder=""></textarea>
        </div>
        <div>
          <label for="orderOutput">Output</label>
          <textarea id="orderOutput" placeholder=""></textarea>
        </div>
      </div>
      <div class="buttons">
        <button onclick="cleanOrder()">Clean Order</button>
        <button class="secondary" onclick="copyText('orderOutput')">Copy</button>
        <button class="secondary" onclick="clearFields('orderInput', 'orderOutput')">Clear</button>
      </div>
      <div class="note"></div>
    </section>
    
    <section class="tool">
      <h2>Character Counter</h2>
      <label for="counterInput">Input</label>
      <textarea id="counterInput" placeholder="" oninput="countCharactersNoSpaces()"></textarea>
      <div class="counter-number" id="charCount">0</div>
      <div class="note">Characters counted without spaces.</div>
      <div class="buttons">
        <button class="secondary" onclick="clearCounter()">Clear</button>
      </div>
    </section>
  </main>

  <script>
    function copyText(id) {
      const box = document.getElementById(id);
      box.select();
      box.setSelectionRange(0, 99999);
      document.execCommand('copy');
    }

    function clearFields(inputId, outputId) {
      document.getElementById(inputId).value = '';
      document.getElementById(outputId).value = '';
    }

    function cleanOrder() {
      const input = document.getElementById('orderInput').value;
      const lines = input.split(/\r?\n/);
      const outputLines = [];
      let lastWasBlank = false;

      for (const raw of lines) {
        const line = raw.trim();

        if (!line) {
          if (outputLines.length && !lastWasBlank) {
            outputLines.push('');
            lastWasBlank = true;
          }
          continue;
        }

        if (!line.includes(':')) continue;

        const value = line.split(':').slice(1).join(':').trim();
        if (!value) continue;

        outputLines.push(value);
        lastWasBlank = false;
      }

      while (outputLines[outputLines.length - 1] === '') {
        outputLines.pop();
      }

      document.getElementById('orderOutput').value = outputLines.join('\n');
    }

    function formatGPS() {
      let text = document.getElementById('gpsInput').value.trim();

      text = text
        .replace(/\s+/g, ' ')
        .replace(/\s*°\s*/g, '° ')
        .replace(/\s*'\s*/g, "' ")
        .replace(/\s*"\s*/g, '" ')
        .replace(/\s+([NSEW])/gi, ' $1')
        .trim();

      document.getElementById('gpsOutput').value = text;
    }

    function addDotsToGPS() {
      const output = document.getElementById('gpsOutput');
      const source = output.value || document.getElementById('gpsInput').value;
      output.value = source.trim().replace(/\s+/g, ' • ');
    }

    const defaultSymbolRules = [
      ['//', '•'],
      ['/', ' '],
      ['-', '•'],
      ['*', '•'],
      ['<3', '♥'],
      ['+', '†']
    ];

    function showRules() {
      document.getElementById('rulesBox').style.display = 'block';
    }

    function addRule(findValue = '', replaceValue = '') {
      const rulesBox = document.getElementById('rulesBox');
      showRules();

      const row = document.createElement('div');
      row.className = 'rules-row';

      row.innerHTML = `
        <span>Replace</span>
        <input type="text" class="findText" placeholder="Find" />
        <span>with</span>
        <input type="text" class="replaceText" placeholder="Replace" />
        <button class="small secondary" onclick="removeRule(this)">✕</button>
      `;

      row.querySelector('.findText').value = findValue;
      row.querySelector('.replaceText').value = replaceValue;

      row.querySelector('.findText').addEventListener('input', convertSymbols);
      row.querySelector('.replaceText').addEventListener('input', convertSymbols);

      rulesBox.appendChild(row);
      convertSymbols();
    }

    function removeRule(button) {
      button.parentElement.remove();
      convertSymbols();

      const rows = document.querySelectorAll('#rulesBox .rules-row');
      if (rows.length === 0) {
        document.getElementById('rulesBox').style.display = 'none';
      }
    }

    function escapeRegex(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function replaceAllSafe(text, findStr, replaceStr) {
      const escaped = escapeRegex(findStr);
      return text.replace(new RegExp(escaped, 'g'), replaceStr);
    }

    function capitalizeEachWord(text) {
      return text.toLowerCase().replace(/\b\w/g, char => char.toUpperCase());
    }

    function convertSymbols() {
      let text = document.getElementById('symbolInput').value;

      defaultSymbolRules.forEach(rule => {
        text = replaceAllSafe(text, rule[0], rule[1]);
      });

      const rows = document.querySelectorAll('#rulesBox .rules-row');

      rows.forEach(row => {
        const find = row.querySelector('.findText').value;
        const replace = row.querySelector('.replaceText').value;

        if (find !== '') {
          text = replaceAllSafe(text, find, replace);
        }
      });

      if (document.getElementById('uppercaseOutput').checked) {
        text = text.toUpperCase();
      } else if (document.getElementById('capitalizeWords').checked) {
        text = capitalizeEachWord(text);
      }

      document.getElementById('symbolOutput').value = text;
    }

    function clearSymbolConverter() {
      document.getElementById('symbolInput').value = '';
      document.getElementById('symbolOutput').value = '';
      document.getElementById('uppercaseOutput').checked = false;
      document.getElementById('capitalizeWords').checked = false;
      document.getElementById('rulesBox').innerHTML = '';
      document.getElementById('rulesBox').style.display = 'none';
    }

    document.getElementById('symbolInput').addEventListener('input', convertSymbols);

    function countCharactersNoSpaces() {
      const text = document.getElementById('counterInput').value;
      const count = text.replace(/\s/g, '').length;
      document.getElementById('charCount').textContent = count;
    }

    function clearCounter() {
      document.getElementById('counterInput').value = '';
      countCharactersNoSpaces();
    }
  </script>
</body>
</html>
