<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engraving Tools Dashboard</title>

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --button: #111827;
      --button-secondary: #f3f4f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      text-align: center;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .tool {
      max-width: 600px;
      margin: 0 auto 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 6px 20px rgba(17, 24, 39, 0.05);
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      display: block;
      margin-bottom: 3px;
      font-weight: bold;
      font-size: 12px;
    }

    textarea,
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      line-height: 1.35;
      background: #fff;
      color: var(--text);
      resize: vertical;
    }

    textarea {
      min-height: 60px;
      white-space: pre-wrap;
    }

    .large textarea {
      min-height: 90px;
    }

    .buttons,
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 0;
      align-items: center;
    }

    button {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12px;
      cursor: pointer;
      background: var(--button);
      color: #fff;
    }

    button.secondary {
      background: var(--button-secondary);
      color: var(--text);
      border-color: var(--border);
    }

    button.small {
      padding: 5px 8px;
      font-size: 11px;
    }

    .checks,
    .options {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      margin: 4px 0 2px;
    }

    .counter-number {
      font-size: 24px;
      font-weight: bold;
      margin-top: 4px;
    }

    #sym_rules {
      display: none;
    }

    .mapping {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 5px;
      font-size: 11px;
    }

    .mapping input {
      width: 95px;
      padding: 5px;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <h1>Engraving Tools Dashboard</h1>

    <section class="tool">
      <h2>GPS Coordinates</h2>
      <div class="grid">
        <div>
          <label for="gpsInput">Input</label>
          <textarea id="gpsInput"></textarea>
        </div>
        <div>
          <label for="gpsOutput">Output</label>
          <textarea id="gpsOutput"></textarea>
        </div>
      </div>
      <div class="buttons">
        <button onclick="copyText('gpsOutput')">Copy</button>
        <button onclick="formatGPS()">Format</button>
        <button class="secondary" onclick="clearFields('gpsInput', 'gpsOutput')">Clear</button>
        <button class="secondary" onclick="addDotsToGPS()">Add dots (•)</button>
      </div>
    </section>

    <section class="tool">
      <h2>•♥†♥†• SYMBOLS •♥†♥†•</h2>

      <div class="grid">
        <div>
          <label for="sym_input">Input</label>
          <textarea id="sym_input"></textarea>
        </div>

        <div>
          <label for="sym_output">Output</label>
          <textarea id="sym_output" readonly></textarea>
        </div>
      </div>

      <div id="sym_rules"></div>

      <div class="checks">
        <label><input type="checkbox" id="sym_uppercase" /> Uppercase</label>
        <label><input type="checkbox" id="sym_capitalize" /> Capitalize Words</label>
      </div>

      <div class="buttons">
        <button id="sym_copy">Copy</button>
        <button id="sym_convert">Format</button>
        <button class="secondary" id="sym_clear">Clear</button>
        <button class="secondary" id="sym_add">+ Add Rule</button>
      </div>
    </section>

    <section class="tool large">
      <h2>Order Details Cleaner</h2>
      <div class="grid">
        <div>
          <label for="orderInput">Input</label>
          <textarea id="orderInput"></textarea>
        </div>
        <div>
          <label for="orderOutput">Output</label>
          <textarea id="orderOutput"></textarea>
        </div>
      </div>
      <div class="buttons">
        <button onclick="copyText('orderOutput')">Copy</button>
        <button onclick="cleanOrder()">Format</button>
        <button class="secondary" onclick="clearFields('orderInput', 'orderOutput')">Clear</button>
      </div>
    </section>

    <section class="tool">
      <h2>Character Counter</h2>
      <label for="counterInput">Input</label>
      <textarea id="counterInput"></textarea>
      <div class="counter-number" id="charCount">0</div>
      <div class="buttons">
        <button class="secondary" onclick="clearCounter()">Clear</button>
      </div>
    </section>
  </main>

  <script>
    function copyText(id) {
      const box = document.getElementById(id);
      box.focus();
      box.select();
      document.execCommand('copy');
    }

    function clearFields(inputId, outputId) {
      document.getElementById(inputId).value = '';
      document.getElementById(outputId).value = '';
    }

    function cleanOrder() {
      const input = document.getElementById('orderInput').value;
      const lines = input.split(/\r?\n/);
      const outputLines = [];
      let lastWasBlank = false;

      for (const raw of lines) {
        const line = raw.trim();

        if (!line) {
          if (outputLines.length && !lastWasBlank) {
            outputLines.push('');
            lastWasBlank = true;
          }
          continue;
        }

        if (!line.includes(':')) continue;

        const value = line.split(':').slice(1).join(':').trim();
        if (!value) continue;

        outputLines.push(value);
        lastWasBlank = false;
      }

      while (outputLines[outputLines.length - 1] === '') {
        outputLines.pop();
      }

      document.getElementById('orderOutput').value = outputLines.join('\n');
    }

    function formatGPS() {
      let text = document.getElementById('gpsInput').value;

      text = text
        .replace(/\s+/g, ' ')
        .replace(/\s*°\s*/g, '° ')
        .replace(/\s*'\s*/g, "' ")
        .replace(/\s*"\s*/g, '" ')
        .replace(/\s*([NSEW])\s*/gi, ' $1 ')
        .replace(/\s+/g, ' ')
        .trim();

      document.getElementById('gpsOutput').value = text;
    }

    function addDotsToGPS() {
      let source = document.getElementById('gpsOutput').value || document.getElementById('gpsInput').value;

      source = source
        .replace(/\s+/g, ' ')
        .replace(/\s*°\s*/g, '° ')
        .replace(/\s*'\s*/g, "' ")
        .replace(/\s*"\s*/g, '" ')
        .replace(/\s*([NSEW])\s*/gi, ' $1 ')
        .replace(/\s+/g, ' ')
        .trim();

      const parts = source.match(/[^NSEW]*[NSEW]/gi);

      if (parts && parts.length) {
        document.getElementById('gpsOutput').value = parts.map(part => part.trim()).join(' • ') + ' •';
      } else {
        document.getElementById('gpsOutput').value = source;
      }
    }

    const symRulesEl = document.getElementById('sym_rules');
    const symInputEl = document.getElementById('sym_input');
    const symOutputEl = document.getElementById('sym_output');
    const symConvertBtn = document.getElementById('sym_convert');
    const symClearBtn = document.getElementById('sym_clear');
    const symUppercaseEl = document.getElementById('sym_uppercase');
    const symCapitalizeEl = document.getElementById('sym_capitalize');
    const symCopyBtn = document.getElementById('sym_copy');
    const symAddBtn = document.getElementById('sym_add');

    function symAddRule(from = '', to = '', show = true) {
      const row = document.createElement('div');
      row.className = 'mapping';
      row.innerHTML =
        `<span>Replace</span>
         <input type="text" value="${from}" data-role="from" />
         <span>with</span>
         <input type="text" value="${to}" data-role="to" />
         <button class="secondary small" data-role="delete">✕</button>`;

      row.querySelector('[data-role="delete"]').addEventListener('click', () => {
        row.remove();
        symConvert();
        if (!symRulesEl.querySelector('.mapping')) symRulesEl.style.display = 'none';
      });

      symRulesEl.appendChild(row);
      if (show) symRulesEl.style.display = 'block';
    }

    [['//','•'],['/','  '],['-','•'],['*','•'],['<3','♥'],['+','†']]
      .forEach(r => symAddRule(r[0], r[1], false));

    function symGetRules() {
      return [...symRulesEl.querySelectorAll('.mapping')]
        .map(r => ({
          from: r.querySelector('[data-role="from"]').value,
          to: r.querySelector('[data-role="to"]').value
        }))
        .filter(x => x.from !== '');
    }

    function symReplaceAllSafe(text, findStr, replaceStr) {
      const e = findStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return text.replace(new RegExp(e, 'g'), replaceStr);
    }

    function symCapitalizeEachWord(str) {
      return str.replace(/\b\w/g, c => c.toUpperCase());
    }

    function symConvert() {
      let r = symInputEl.value;

      for (const {from, to} of symGetRules()) {
        r = symReplaceAllSafe(r, from, to);
      }

      if (symUppercaseEl.checked) {
        r = r.toUpperCase();
      } else if (symCapitalizeEl.checked) {
        r = symCapitalizeEachWord(r.toLowerCase());
      }

      symOutputEl.value = r;
    }

    symConvertBtn.addEventListener('click', symConvert);
    symInputEl.addEventListener('input', symConvert);
    symRulesEl.addEventListener('input', symConvert);
    symUppercaseEl.addEventListener('change', symConvert);
    symCapitalizeEl.addEventListener('change', symConvert);

    symAddBtn.addEventListener('click', () => symAddRule('', '', true));

    symClearBtn.addEventListener('click', () => {
      symInputEl.value = '';
      symOutputEl.value = '';
      symUppercaseEl.checked = false;
      symCapitalizeEl.checked = false;
    });

    symCopyBtn.addEventListener('click', () => {
      symOutputEl.focus();
      symOutputEl.select();
      document.execCommand('copy');
    });

    function countCharactersNoSpaces() {
      const text = document.getElementById('counterInput').value;
      document.getElementById('charCount').textContent = text.replace(/\s/g, '').length;
    }

    function clearCounter() {
      document.getElementById('counterInput').value = '';
      countCharactersNoSpaces();
    }

    document.getElementById('gpsInput').addEventListener('input', formatGPS);
    document.getElementById('orderInput').addEventListener('input', cleanOrder);
    document.getElementById('counterInput').addEventListener('input', countCharactersNoSpaces);
  </script>
</body>
</html>
