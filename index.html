<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engraving Tools Dashboard</title>

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --button: #111827;
      --button-secondary: #f3f4f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      text-align: center;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .tool {
      max-width: 600px;
      margin: 0 auto 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 6px 20px rgba(17, 24, 39, 0.05);
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      display: block;
      margin-bottom: 3px;
      font-weight: bold;
      font-size: 12px;
    }

    textarea,
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      line-height: 1.35;
      background: #fff;
      color: var(--text);
      resize: vertical;
    }

    textarea {
      min-height: 60px;
      white-space: pre-wrap;
    }

    .large textarea {
      min-height: 90px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 0;
    }

    button {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12px;
      cursor: pointer;
      background: var(--button);
      color: #fff;
    }

    button.secondary {
      background: var(--button-secondary);
      color: var(--text);
      border-color: var(--border);
    }

    button.small {
      padding: 5px 8px;
      font-size: 11px;
    }

    #rulesBox {
      display: none;
      margin-top: 6px;
    }

    .rules-row {
      display: grid;
      grid-template-columns: auto 1fr auto 1fr auto;
      gap: 5px;
      margin-bottom: 5px;
      align-items: center;
      font-size: 11px;
    }

    .rules-row input {
      padding: 5px;
      font-size: 11px;
    }

    .checks {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      margin: 4px 0 2px;
    }

    .counter-number {
      font-size: 24px;
      font-weight: bold;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <h1>Engraving Tools Dashboard</h1>

    <section class="tool">
      <h2>GPS Coordinates</h2>
      <div class="grid">
        <div>
          <label for="gpsInput">Input</label>
          <textarea id="gpsInput"></textarea>
        </div>
        <div>
          <label for="gpsOutput">Output</label>
          <textarea id="gpsOutput"></textarea>
        </div>
      </div>
      <div class="buttons">
        <button onclick="copyText('gpsOutput')">Copy</button>
        <button onclick="formatGPS()">Format</button>
        <button class="secondary" onclick="clearFields('gpsInput', 'gpsOutput')">Clear</button>
        <button class="secondary" onclick="addDotsToGPS()">Add dots (•)</button>
      </div>
    </section>

    <section class="tool">
      <h2>•♥†♥†• SYMBOLS •♥†♥†•</h2>
      <div class="grid">
        <div>
          <label for="symbolInput">Input</label>
          <textarea id="symbolInput"></textarea>
        </div>
        <div>
          <label for="symbolOutput">Output</label>
          <textarea id="symbolOutput"></textarea>
        </div>
      </div>

      <div id="rulesBox"></div>

      <div class="checks">
        <label><input type="checkbox" id="uppercaseOutput" /> Uppercase</label>
        <label><input type="checkbox" id="capitalizeWords" /> Capitalize Words</label>
      </div>

      <div class="buttons">
        <button onclick="copyText('symbolOutput')">Copy</button>
        <button onclick="convertSymbols()">Format</button>
        <button class="secondary" onclick="clearSymbolConverter()">Clear</button>
        <button class="secondary" onclick="addRule()">+ Add Rule</button>
      </div>
    </section>

    <section class="tool large">
      <h2>Order Details Cleaner</h2>
      <div class="grid">
        <div>
          <label for="orderInput">Input</label>
          <textarea id="orderInput"></textarea>
        </div>
        <div>
          <label for="orderOutput">Output</label>
          <textarea id="orderOutput"></textarea>
        </div>
      </div>
      <div class="buttons">
        <button onclick="copyText('orderOutput')">Copy</button>
        <button onclick="cleanOrder()">Format</button>
        <button class="secondary" onclick="clearFields('orderInput', 'orderOutput')">Clear</button>
      </div>
    </section>

    <section class="tool">
      <h2>Character Counter</h2>
      <label for="counterInput">Input</label>
      <textarea id="counterInput"></textarea>
      <div class="counter-number" id="charCount">0</div>
      <div class="buttons">
        <button class="secondary" onclick="clearCounter()">Clear</button>
      </div>
    </section>
  </main>

  <script>
    function copyText(id) {
      const box = document.getElementById(id);
      box.focus();
      box.select();
      document.execCommand('copy');
    }

    function clearFields(inputId, outputId) {
      document.getElementById(inputId).value = '';
      document.getElementById(outputId).value = '';
    }

    function cleanOrder() {
      const input = document.getElementById('orderInput').value;
      const lines = input.split(/\r?\n/);
      const outputLines = [];
      let lastWasBlank = false;

      for (const raw of lines) {
        const line = raw.trim();

        if (!line) {
          if (outputLines.length && !lastWasBlank) {
            outputLines.push('');
            lastWasBlank = true;
          }
          continue;
        }

        if (!line.includes(':')) continue;

        const value = line.split(':').slice(1).join(':').trim();
        if (!value) continue;

        outputLines.push(value);
        lastWasBlank = false;
      }

      while (outputLines[outputLines.length - 1] === '') {
        outputLines.pop();
      }

      document.getElementById('orderOutput').value = outputLines.join('\n');
    }

    function formatGPS() {
      let text = document.getElementById('gpsInput').value;

      text = text
        .replace(/\s+/g, ' ')
        .replace(/\s*°\s*/g, '° ')
        .replace(/\s*'\s*/g, "' ")
        .replace(/\s*"\s*/g, '" ')
        .replace(/\s*([NSEW])\s*/gi, ' $1 ')
        .replace(/\s+/g, ' ')
        .trim();

      document.getElementById('gpsOutput').value = text;
    }

    function addDotsToGPS() {
      let source = document.getElementById('gpsOutput').value || document.getElementById('gpsInput').value;

      source = source
        .replace(/\s+/g, ' ')
        .replace(/\s*°\s*/g, '° ')
        .replace(/\s*'\s*/g, "' ")
        .replace(/\s*"\s*/g, '" ')
        .replace(/\s*([NSEW])\s*/gi, ' $1 ')
        .replace(/\s+/g, ' ')
        .trim();

      const parts = source.match(/[^NSEW]*[NSEW]/gi);

      if (parts && parts.length) {
        document.getElementById('gpsOutput').value = parts
          .map(part => part.trim())
          .join(' • ') + ' •';
      } else {
        document.getElementById('gpsOutput').value = source;
      }
    }

    const defaultSymbolRules = [
      ['//', ' • '],
      [' . ', ' • '],
      ['.', ' • '],
      [' - ', ' • '],
      ['-', ' • '],
      ['*', ' • '],
      ['<3', '♥'],
      ['+', '†'],
      [' / ', ' '],
      ['/', ' ']
    ];

    function replaceAllText(text, find, replace) {
      return text.split(find).join(replace);
    }

    function cleanSymbolSpacing(text) {
      return text
        .replace(/\s+/g, ' ')
        .replace(/\s*•\s*/g, ' • ')
        .replace(/\s*♥\s*/g, ' ♥ ')
        .replace(/\s*†\s*/g, ' † ')
        .replace(/\s+/g, ' ')
        .trim();
    }

function convertSymbols() {
  let text = document.getElementById('symbolInput').value;

  // Numbers like 4-18-26 → 4•18•26
  text = text.replace(/(\d)-(\d)/g, '$1•$2');

  // Spaced dash between words → word separator
  text = text.replace(/\s-\s/g, ' • ');

  // Dot separators between words
  text = text.replace(/\s\.\s/g, ' • ');

  // Other default symbol conversions
  text = text.replace(/\/\/+/g, ' • ');
  text = text.replace(/\*/g, ' • ');
  text = text.replace(/<3/g, '♥');
  text = text.replace(/\+/g, '†');
  text = text.replace(/\//g, ' ');

  // Clean spacing, but keep number bullets tight: 4•18•26
  text = text
    .replace(/\s+/g, ' ')
    .replace(/\s*•\s*/g, (match, offset, string) => {
      const prev = string[offset - 1];
      const next = string[offset + match.length];

      if (/\d/.test(prev) && /\d/.test(next)) {
        return '•';
      }

      return ' • ';
    })
    .replace(/\s*♥\s*/g, ' ♥ ')
    .replace(/\s*†\s*/g, ' † ')
    .trim();

  // Custom visible rules, if you add any
  document.querySelectorAll('#rulesBox .rules-row').forEach(row => {
    const find = row.querySelector('.findText').value;
    const replace = row.querySelector('.replaceText').value;

    if (find !== '') {
      text = text.split(find).join(replace);
    }
  });

  if (document.getElementById('uppercaseOutput').checked) {
    text = text.toUpperCase();
  } else if (document.getElementById('capitalizeWords').checked) {
    text = text.toLowerCase().replace(/\b\w/g, char => char.toUpperCase());
  }

  document.getElementById('symbolOutput').value = text;
}

    function addRule(findValue = '', replaceValue = '') {
      const rulesBox = document.getElementById('rulesBox');
      rulesBox.style.display = 'block';

      const row = document.createElement('div');
      row.className = 'rules-row';

      row.innerHTML = `
        <span>Replace</span>
        <input type="text" class="findText" />
        <span>with</span>
        <input type="text" class="replaceText" />
        <button class="small secondary" onclick="removeRule(this)">✕</button>
      `;

      row.querySelector('.findText').value = findValue;
      row.querySelector('.replaceText').value = replaceValue;

      row.querySelector('.findText').addEventListener('input', convertSymbols);
      row.querySelector('.replaceText').addEventListener('input', convertSymbols);

      rulesBox.appendChild(row);
      convertSymbols();
    }

    function removeRule(button) {
      button.parentElement.remove();
      convertSymbols();

      if (document.querySelectorAll('#rulesBox .rules-row').length === 0) {
        document.getElementById('rulesBox').style.display = 'none';
      }
    }

    function clearSymbolConverter() {
      document.getElementById('symbolInput').value = '';
      document.getElementById('symbolOutput').value = '';
      document.getElementById('uppercaseOutput').checked = false;
      document.getElementById('capitalizeWords').checked = false;
      document.getElementById('rulesBox').innerHTML = '';
      document.getElementById('rulesBox').style.display = 'none';
    }

    function countCharactersNoSpaces() {
      const text = document.getElementById('counterInput').value;
      document.getElementById('charCount').textContent = text.replace(/\s/g, '').length;
    }

    function clearCounter() {
      document.getElementById('counterInput').value = '';
      countCharactersNoSpaces();
    }

    document.getElementById('gpsInput').addEventListener('input', formatGPS);
    document.getElementById('symbolInput').addEventListener('input', convertSymbols);
    document.getElementById('orderInput').addEventListener('input', cleanOrder);
    document.getElementById('counterInput').addEventListener('input', countCharactersNoSpaces);
    document.getElementById('uppercaseOutput').addEventListener('change', convertSymbols);
    document.getElementById('capitalizeWords').addEventListener('change', convertSymbols);
  </script>
</body>
</html>
